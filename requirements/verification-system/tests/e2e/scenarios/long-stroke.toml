[[turn]]
id = "engineer"
lane = "engineer"
user = "# Write publish_proof.txt."
tools = ["todowrite-for-engineer"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "todowrite-for-engineer", args = {  program = "class Js extends JsProgram { async run() { await this.write('publish_proof.txt', 'Published by long-stroke canary\\n'); return { written: true }; } }" } }

  # Read probe on the programming surface: ordinary Engineer mainline.
  # Unique path makes message.part.updated correlation unambiguous in the real Host SSE stream.
  [[turn.step]]
  respond = { type = "tool-call", tool = "todowrite-for-engineer", args = {  program = "class Js extends JsProgram { async run() { return await this.cat('read_probe.txt'); } }" } }

  [[turn.step]]
  # A subagent is settled as completed only by `js.deliver` (repository-programming-054/059):
  # a plain `return` leaves the delivery cell empty and the child reports `undelivered`,
  # so no `HandleCompleted` is written and the join never closes.
  respond = { type = "tool-call", tool = "todowrite-for-engineer", args = {  program = "class Js extends JsProgram { async run() { return this.deliver({ file: 'publish_proof.txt', written: true }) } }" } }

  # The delivery tool result asks the provider once more; the child closes its turn here.
  [[turn.step]]
  respond = { type = "text", text = "Engineer delivered." }

[[turn]]
id = "engineer-resolve"
internal = true
user = "# Resolve the conflicted publish_proof.txt so it contains exactly: Published by long-stroke canary"
tools = ["todowrite-for-engineer"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "todowrite-for-engineer", args = {  program = "class Js extends JsProgram { async run() { this.write('publish_proof.txt', 'Published by long-stroke canary\\n'); return { written: true }; } }" } }

  [[turn.step]]
  # Same rule for the repair child: only `js.deliver` settles it as completed.
  respond = { type = "tool-call", tool = "todowrite-for-engineer", args = {  program = "class Js extends JsProgram { async run() { return this.deliver({ file: 'publish_proof.txt', resolved: true }) } }" } }

  [[turn.step]]
  respond = { type = "text", text = "Conflict file resolved." }

