setup = { strict = true, preFlowTurns = ["humanroot-manager-title", "humanroot-loop", "strength-manager-assess", "strength-canary-owner-title", "strength-recovery-owner-title"], maxJournalEvents = 699, maxSseEvents = 3351, mcpFixture = "semble", project = { files = { "AGENTS.md" = "long stroke\n", "README.md" = "# long-stroke\n", "read_probe.txt" = "long-stroke-read-probe\n", ".wanxiang/casebook/.keep" = "", "large_probe.txt" = "LARGE_READ_PROBE_MARKER line 0001 \nLARGE_READ_PROBE_MARKER line 0002 \nLARGE_READ_PROBE_MARKER line 0003 \nLARGE_READ_PROBE_MARKER line 0004 \nLARGE_READ_PROBE_MARKER line 0005 \nLARGE_READ_PROBE_MARKER line 0006 \nLARGE_READ_PROBE_MARKER line 0007 \nLARGE_READ_PROBE_MARKER line 0008 \nLARGE_READ_PROBE_MARKER line 0009 \nLARGE_READ_PROBE_MARKER line 0010 \nLARGE_READ_PROBE_MARKER line 0011 \nLARGE_READ_PROBE_MARKER line 0012 \nLARGE_READ_PROBE_MARKER line 0013 \nLARGE_READ_PROBE_MARKER line 0014 \nLARGE_READ_PROBE_MARKER line 0015 \nLARGE_READ_PROBE_MARKER line 0016 \nLARGE_READ_PROBE_MARKER line 0017 \nLARGE_READ_PROBE_MARKER line 0018 \nLARGE_READ_PROBE_MARKER line 0019 \nLARGE_READ_PROBE_MARKER line 0020 \nLARGE_READ_PROBE_MARKER line 0021 \nLARGE_READ_PROBE_MARKER line 0022 \nLARGE_READ_PROBE_MARKER line 0023 \nLARGE_READ_PROBE_MARKER line 0024 \nLARGE_READ_PROBE_MARKER line 0025 \nLARGE_READ_PROBE_MARKER line 0026 \nLARGE_READ_PROBE_MARKER line 0027 \nLARGE_READ_PROBE_MARKER line 0028 \nLARGE_READ_PROBE_MARKER line 0029 \nLARGE_READ_PROBE_MARKER line 0030 \nLARGE_READ_PROBE_MARKER line 0031 \nLARGE_READ_PROBE_MARKER line 0032 \nLARGE_READ_PROBE_MARKER line 0033 \nLARGE_READ_PROBE_MARKER line 0034 \nLARGE_READ_PROBE_MARKER line 0035 \nLARGE_READ_PROBE_MARKER line 0036 \nLARGE_READ_PROBE_MARKER line 0037 \nLARGE_READ_PROBE_MARKER line 0038 \nLARGE_READ_PROBE_MARKER line 0039 \nLARGE_READ_PROBE_MARKER line 0040 " } } }
