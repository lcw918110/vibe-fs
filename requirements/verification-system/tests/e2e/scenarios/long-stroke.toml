# ── DELEGATE 14.5: explicit read-only delegation legs ───────────────────────
#
# Predictor 模型配置是唯一启用依据（spec WHAT[014]）：E2E 中调度模块运行在独立
# spawn 的 opencode 进程内，测试进程的 __wanxiangshu_test_predictor_state 开关
# 到不了那里，因此上方 routingSource 直接声明 configured，并让
# purpose='readonly-delegate' 选中 Predictor 池模型 test/test-model-b；owner 仍
# 走角色池 test/test-model，角色与参与者身份不变。
#
# 腿1 正常完成 + 腿2 提前结束 + 腿3 自然截断：preflow 的 strength-canary-owner
# 由 014.test.mjs preFlowCanaries 创建驱动，其同伴 bootstrap 交付数由该文件
# matchCount('strength-canary-replica.0') === 1 钉住。budget=2：同伴第 1 轮读
# large_probe.txt（工具既有截断由宿主掌握；帧只保存实际返回字节，marker 在头部，
# 截断也存活），第 2 轮以纯文本提前结束；材料经 Prepared → Promoted 回传 owner
# 的后续请求。
# 腿4 恢复：主流程新建 strength-recovery-owner，其续行步挂 provider-error 500
# retryable（Host 自重试，PAR-019）。Requested 在同一 transform 的 capture 阶段、
# 故障前已落盘；Prepared 候选在重试交付上原样重渲染，不重跑只读工具
# （DELEGATE-10 恢复路径）。
#
# internal=true 的回合（两个 owner 的提示词由测试代码组装、同伴的镜像提示由生产
# 组装）不参加 dead-edge 检查，也不进 expectSatisfied——其交付由 waitFact 事实
# 屏障、preflow matchCount 与自定义 oracle 从持久事实与公开 wire 证明。owner 与
# 同伴条目共享同一 user 前缀（同伴镜像的最后一条 user 消息就是 owner 提示词），
# 靠 tools 门禁区分：owner 要求 js-manager，同伴禁止之。
#
# owner 角色是 manager（014 preFlow 与 flow 的 createSession 均以 manager 建会话）：
# 委托 capture 要求 root owner work，而顶层 manager API 会话是本世界唯一的
# HumanRoot root-work 形态（同文件 humanroot 会话的先例）；顶层 engineer 会话被
# 判为 subsession，capture 会以 not-root-owner-work 正确拒绝。同伴仍以其继承的
# manager 角色运行，只读工具面不变。
#
# 容量 1 父等子（判据：同 provider、容量 1 时父等子不死锁、不双占）：容量账本
# 按 provider 建条且每 provider 恰一张票（ModelRouting.fs 的 ledger 构造；
# execution-model-routing 003 已在 surface 级实证一次 acquire 建成一 entry 一
# token）。本世界所有会话同路由到 test provider，因此委托支线的 owner 与同伴
# 天然共享唯一票——父等子是既成物理而非编程模拟，routingSource 无需改动。
# wire 可证部分由 assertDelegateCapacityOneParentWaits 断言：同 provider、双方
# 模型池不同，且 owner 发起委托的请求晚于同伴全部请求到达（transform 直到同伴
# 结束才放行父请求 = 父在等且未死锁）；「不双占」由上述账本结构保证、在
# execution-model-routing 单测载体证明，E2E 侧不重复断言。「取消时 fence/child
# 释放」在此结构下不可构造：同伴生命周期同步吞并在 owner 的 transform 内，
# 外部 abort 只能发生在该 transform 返回之后，抓不到进行中的子——如实记为未决，
# 不造替代证明。

