# The Long Stroke — G4R-3 sole OpenCode world (changes/active/test.md §4 / §21).
#
# One continuous OpenCode lifetime. Never set afterExpectation.restart /
# flow.restart (recovery = durable facts in the same PID; §12). Observe durable
# facts + public results only — no internal program-counter choreography (§7).
# Wall clock must stay short (§16).
#
# Outer shell = orchestrator (commission → join). Inner Manager walks the
# adversity spine; publish conflict resumes the SAME Manager (ORCH-007).
#
# ── natural story (compressed from orch-unhappy + manager-unhappy + fallback) ─
#
#   Birth (Orchestrator)
#     ↓
#   commission / ManagerJobCreated (AgentOwnerRoot; first deliver migrates Life)
#     ↓
#   Manager forks engineer; join blocked; child held incomplete
#     ↓
#   external user_message wakes join (interrupted / reason=user_message)
#     ↓
#   harvest → provider-error → recovery provider-error → FailureRecorded eq 2 → success
#     ↓
#   Iteration #1: audit assigns work on low dimension → current-action nudge → IncumbencyRetired(Continue) → IncumbencyOpened
#     ↓
#   Iteration #2: 8×10 independent audit → IncumbencyRetired(Continue) → CandidateReady
#     ↓
#   stale target forces rebase → ConflictDetected (no restart)
#     ↓
#   Iteration #3: same authority, fresh IncumbencyOpened → low-score work assigned → repairs conflict → IncumbencyRetired(Continue)
#     ↓
#   Iteration #4: same authority, fresh IncumbencyOpened → independent re-audit 8×10 → IncumbencyRetired(Accepted) → RebasedCandidateReady → Published
#     ↓
#   orch join / expectSatisfied / oracleLongStroke
#
# ── §21 adversity checklist (one representative path each) ───────────────────
#
#   [x] provider transient failure          — [[fault]] provider-error + assertProviderTransientFailure
#   [x] provider failure continuation       — manager.1→continue.0 + assertProviderFailureContinuation
#   [x] join blocked then causally awakened — flow.prompt wake + assertJoinWakePath
#   [x] non-10 assessment assigns work      — Reviewed + assertAssessmentAssignsWork
#   [x] interrupted/aborted child or session— holdChildC1UntilLabor + assertInterruptedJoin
#   [x] retirement needs next iteration     — non-10 blocks publication + Continue → fresh IncumbencyOpened + assertRetirementNeedsIteration
#   [x] durable recovery/continuation       — same PID FailureRecorded + assertDurableRecovery
#   [x] publish conflict / stale target     — gitConflictProof on manager-loop.1 (no restart) + assertPublishConflict
#   [x] successful reconciliation           — Orchestrator-tagged Published eq 1 + assertSuccessfulReconciliation
#   [x] later successful retirement         — IncumbencyRetired after resources converge + assertIncumbencyRetired
#
# Yield / hang risks (estimated):
#   - IncumbencyRetired waitFact: waits for recursive resource closure
#   - ConflictDetected / Published: rebase+barrier lag; timeouts mirror orch-unhappy (60–90s caps)
#   - interrupt requires holdChildC1UntilLabor; without hold, drain completes child and skips user_message
#   - non-10 assessment assigns work; the next iteration independently re-audits before publication
#   - wall <6s target vs orch publish chain — risk of §16 miss until flesh/perf pass
#
# Anchors (lean extract, not a paste): orchestrator-unhappy-path (conflict→Published,
# no restart), manager-unhappy (join wake / low assessment), fallback.toml (consecutive provider failures).

scenario = "long-stroke"
description = "G4R-3 The Long Stroke: orchestrator shell, one OpenCode world through adversity to clean shutdown"
pass = "Long Stroke orch-shell: join-wake+interrupted/user_message, provider-fallback, audit-low-score→Continue→IncumbencyOpened→Accepted, gitConflictProof→ConflictDetected→RebasedCandidate→Published (no restart)."

routingSource = '''
import { appendFileSync } from 'node:fs'

const candidates = ['test/test-model', 'opencode/test-model', 'backup/test-model']
const failed = new Set()
const providerOf = (model) => model.slice(0, model.indexOf('/'))
export const markProviderFailed = (provider) => failed.add(provider)
export const routingProtocol = 2
export const hasTheoreticalCapacity = (role, purpose) => true

const sharedModel = 'test/test-model-b'

// DELEGATE 9.2 (C): 每次真实路由决策 (role + purpose -> model) 记录到本配置文件
// 同目录的决策日志。provider wire 上不出现 purpose，这个日志是"同伴目标确实由
// readonly-delegate 用途路由而来"的直接见证。写失败不影响调度（purpose 参数
// 本身已由单元缝证明）；日志缺失由 oracle fail-closed。
const decisionsPath = new URL('./wanxiangshu-routing-decisions.jsonl', import.meta.url)
const recordRoutingDecision = (role, purpose, model) => {
  try {
    appendFileSync(decisionsPath, `${JSON.stringify({ role, purpose, model })}\n`)
  } catch {
    // best-effort test scaffolding: scheduling must never depend on a log
  }
}

export default function route(role, running, previous, purpose) {
  if (!new Set(['manager', 'orchestrator', 'engineer', 'devops', 'plan', 'advisor']).has(role)) {
    throw new Error('unexpected managed role: ' + role)
  }

  let target
  if (role === 'manager') {
    if (previous != null && !failed.has(providerOf(previous.model))) {
      target = previous
    } else {
      const model = candidates.find((candidate) => !failed.has(providerOf(candidate)))
      target = { model: model ?? candidates.at(-1), reasoning: 'none' }
    }
  } else {
    target = previous ?? { model: sharedModel, reasoning: 'none' }
  }

  recordRoutingDecision(role, purpose, target.model)
  return target
}
'''

# Event ceilings (fail-closed on dead loops; primary over silence watchdog):
#   maxJournalEvents — complete 56-step legal stroke after explicit preflow authority,
#                      detached Bookkeeper finalization, and direct same-physical iteration
#                      re-audit. Complete canaries measured ≤466 envelopes.
#   maxSseEvents     — OpenCode SSE excluding server.heartbeat; complete canaries measured ≤2234 frames.
#                      Pins 699/3351 retain 50% above observed maxima while failing fast on loops.
#                      Both are machine-checked runaway ceilings, not wall-clock budgets; a future
#                      legitimate topology change must re-measure the complete stroke first.
#
setup = { strict = true, preFlowTurns = ["humanroot-manager-title", "humanroot-loop"], maxJournalEvents = 699, maxSseEvents = 3351, mcpFixture = "semble", project = { files = { "AGENTS.md" = "long stroke\n", "README.md" = "# long-stroke\n", "read_probe.txt" = "long-stroke-read-probe\n", ".wanxiang/casebook/.keep" = "" } } }
session = { agent = "orchestrator", bind = ["title", "orchestrator"] }
prompt = { agent = "orchestrator", text = "Ship publish_proof.txt to the target branch through the long stroke." }

must = [
  "humanroot-loop.0",
  "humanroot-loop.1",
  "orch.0",
  "manager-loop.0",
  "manager-loop.1",
  "manager-loop.2",
  "continue.0",
  "engineer.0",
  "engineer.1",
  "engineer.2",
  "engineer-resolve.0",
  # orch.2 = join harvest text after Published (orch-unhappy Stroke 6). EXEC-016
  "orch.2",
]

flow = [
  # External injections before any wait (register holds / retire hooks / conflict).
  { custom = "holdChildC1UntilLabor" },
  # Arm before orch.2 can possibly occur. The final Orchestrator lifetime contains
  # many continuations/idle edges, so its completion barrier is expectation-scoped:
  # orch.2 provider acceptance freezes the SSE baseline, then Stroke 6 waits for
  # the root session idle strictly after that baseline.
  { armIdle = { id = "orch.2" } },
  { armIdle = { id = "engineer.2" } },
  { armIdle = { id = "manager-interrupt.0" } },

  # Stale-head AFTER manager worktree exists (orch-unhappy / restart-conflict canary note).
  # gitConflictProof ONLY — zero restart fields (§12 one OpenCode lifetime).
  { afterExpectation = { id = "manager-loop.1", gitConflictProof = true } },

  # Orchestrator Birth → ManagerJob
  { wait = "orch.0" },
  { waitFact = { name = "ManagerJobCreated", eq = 1 } },
  { bindChild = { agent = "manager", bind = ["manager"] } },

  # Iteration #1 starts read-only. One low dimension atomically assigns work,
  # then the current iteration can fork → join; join stays in flight while child held.
  # Host evidence advertises independent assume plus the native todowrite surface.
  # The Manager surface claim is proven from wire evidence at the end of the stroke.
  # All Manager prompts MUST use session="child" (bindChild); default session is Orchestrator.
  # The initial HumanRoot prompt and every owner-opened incarnation reuse the same
  # authority-first manager-loop entry; the binder varies review results by durable attempt.
  { wait = "manager-loop.0" },
  # Manager loop first main assessment (session = "child"): precisely 1 for this road/branch,
  # decoupled from preflow/world Reviewed total.
  { waitFact = { name = "Reviewed", eq = 1, session = "child" }, timeoutMs = 60000 },
  { wait = "manager-loop.1" },
  # The held child request proves the forked run is active before the idle join
  # attempt. Without this causal barrier, join may correctly report NothingToJoin
  # while the fork tool is still starting the child provider request.
  { wait = "engineer.0", timeoutMs = 60000 },
  { wait = "manager-loop.2", timeoutMs = 60000 },
  { wait = "continue.0", attempts = 2, timeoutMs = 60000 },
  { waitFact = { name = "FailureRecorded", eq = 2 }, timeoutMs = 60000 },
  # EXEC-017 stimulus must target an ACTIVE join attempt. Provider expectation only
  # proves the model returned a join call; wait for the real Host ToolPart running
  # event before injecting the external user message, or the wake is correctly dropped.
  { custom = "awaitManagerJoinRunning" },
  { prompt = { agent = "manager", text = "Interrupt the active join.", releaseHeldChildAfterAccepted = true }, session = "child", timeoutMs = 60000 },
  { wait = "manager-interrupt.0", timeoutMs = 60000 },
  { wait = "engineer.2", timeoutMs = 60000 },
  { awaitIdle = { after = "engineer.2" }, timeoutMs = 60000 },
  { awaitIdle = { after = "manager-interrupt.0" }, timeoutMs = 60000 },
    # The live child-completion fact is `HandleWorkCompleted` (observed once per delivered
  # child in the run); the legacy `HandleCompleted` case is not written any more.
  { waitFact = { name = "HandleWorkCompleted", gte = 1 }, timeoutMs = 60000 },

  # Bounded current-action cursors are verified by durable retirement and the
  # Host cognitive-tool canary (assume) rather than one incidental transport step number.
  # HumanRoot preflow baseline: +2 IncumbencyRetired(Continue+Accepted) / +2 IncumbencyOpened.
  # A Continue retirement is followed by another ordinary IncumbencyOpened event
  # and a physically observed provider request; Accepted exits.
  { waitFact = { name = "IncumbencyRetired", gte = 3 }, timeoutMs = 60000 },
  { waitFact = { name = "IncumbencyOpened", gte = 4 }, timeoutMs = 60000 },

  # Iteration #2 independently audits the current snapshot at 8×10 and retires
  # with Outcome Continue. Every iteration starts from the same typed authority
  # user messages and current workspace.
  # That quality candidate reaches Change; the stale target forces rebase and the
  # deliberately conflicting target edit yields the machine ConflictDetected fact.
  # The Manager owner opens iteration #2 through the same manager-assess resource.
  # Durable facts order every later incarnation; prompt text never encodes an index.
  { waitFact = { name = "Reviewed", gte = 4 }, timeoutMs = 60000 },
  { waitFact = { name = "IncumbencyRetired", gte = 4 }, timeoutMs = 60000 },
  { waitFact = { name = "CandidateReady", eq = 1 }, timeoutMs = 60000 },
  { waitFact = { name = "ConflictDetected", gte = 1 }, timeoutMs = 60000 },

  # Iteration #3 is a fresh IncumbencyOpened on the same authority. Its low
  # assessment assigns a fresh Conflict Resolver child to repair the conflict,
  # then retires with Outcome Continue. A retired iteration
  # never resumes; each iteration-first carries only the current iteration, with
  # the exact owner-controlled assessment resource after the authority prefix.
  { waitFact = { name = "IncumbencyOpened", gte = 5 }, timeoutMs = 60000 },
  { waitFact = { name = "Reviewed", gte = 5 }, timeoutMs = 60000 },
  { wait = "engineer-resolve.0", timeoutMs = 60000 },
  { wait = "engineer-resolve.1", timeoutMs = 60000 },
  { awaitIdle = { after = "engineer-resolve.1" }, timeoutMs = 60000 },
  # The conflict repair uses the same manager-work resource and a fresh owned handle;
  # the owner harvests and retires it without an external continuation prompt.
  { waitFact = { name = "IncumbencyRetired", gte = 5 }, timeoutMs = 60000 },

  # Iteration #4 independently re-audits the repaired snapshot at 8×10 from the
  # same authority. A fresh certificate (Outcome Accepted) is required before
  # rebase completion/publish can proceed; Accepted exits with no further iteration.
  { waitFact = { name = "IncumbencyOpened", gte = 6 }, timeoutMs = 60000 },
  { waitFact = { name = "Reviewed", gte = 6 }, timeoutMs = 60000 },
  { waitFact = { name = "IncumbencyRetired", gte = 6 }, timeoutMs = 60000 },
  { waitFact = { name = "RebasedCandidateReady", gte = 1 }, timeoutMs = 90000 },
  { waitFact = { name = "Published", eq = 1 }, timeoutMs = 90000 },

  # Stroke 6 — Orchestrator harvest (same as orch-unhappy: orch.2 after Published).
  # awaitIdle is anchored at the actual orch.2 request, not at the lifetime-wide
  # initial prompt cursor; this remains edge-race safe even when idle lands before
  # the flow reaches this line.
  { wait = "orch.2", timeoutMs = 60000 },
  { awaitIdle = { after = "orch.2" }, timeoutMs = 60000 },
  { custom = "oracleLongStroke" },
  { assertDeliveries = { id = "engineer.1", eq = 1 } },
  # Production Manager tool surface, observed on the wire the Host actually sent.
  { custom = "assertManagerToolSurfaceOnWire" },

  { expectSatisfied = true },
]

# A Continue retirement opens the next iteration on the same session: system, tools
# and root authority stay fixed, the predecessor's history is retained in order, and
# the only admitted in-prefix change is the retired auxiliary guidance suffix
# (context-compression-019). The successor therefore breaks the raw seal exactly once,
# when its own assess resource lands at step 0.
[[epoch]]
turn = "manager-reopened-loop"
step = 0
reason = "manager-loop"


[[turn]]
id = "humanroot-manager-title"
lane = "humanroot-manager"
kind = "title"
user = "HUMANROOT_MANAGER_LOOP_CANARY: run the independent HumanRoot manager assessment check."

  [[turn.step]]
  respond = { type = "title", text = "HumanRoot Manager Loop Canary" }

# ONE reusable HumanRoot loop family: same lane/authority/steps reused for both
# iterations. The binder returns low review on first delivery (Continue) and
# perfect on second (Accepted); step-1 deliver is identical. Provider-visible
# user stays the original authority because the wake is stripped.
# The retirement is the two-stage deliver of work-006: the first call commits the
# confirmation and does not end, a second call with a different toolCallId reads
# the review outcome and retires. Step 2 is that closing call; it never injects a
# user message, so the same turn keeps owning the cursor.
[[turn]]
id = "humanroot-loop"
lane = "humanroot-manager"
user = "HUMANROOT_MANAGER_LOOP_CANARY: run the independent HumanRoot manager assessment check."
tools = ["review", "deliver"]

  [[turn.step]]
  runtimeStep = 0
  respond = { type = "tool-call", tool = "review", prefixText = "HumanRoot canary first audit finds one material issue remains.", args = { findings = [{ acceptance_criteria = "the target state is not yet reached", work_plan = "close the remaining gap" }] } }

  [[turn.step]]
  runtimeStep = 1
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 2
  respond = { type = "tool-call", tool = "deliver", args = {} }

[[turn]]
id = "title"
lane = "title"
kind = "title"
user = "Ship publish_proof.txt to the target branch through the long stroke."

  [[turn.step]]
  respond = { type = "title", text = "Long Stroke" }

[[turn]]
id = "orch"
lane = "orchestrator"
user = "Ship publish_proof.txt to the target branch through the long stroke."
tools = ["commission", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "commission", args = { calling = "lead", name = "Long Stroke Road", charge = "Run the long stroke: ship publish_proof.txt — join-wake, provider fallback, accept the assessment obligation then retire so publish can proceed." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  # Join stays blocked until Manager Published; then this harvest text (required).
  [[turn.step]]
  respond = { type = "text", text = "Long stroke publish completed after conflict resume." }

# EXEC-016 / INTERACTION-AUTHORITY-014: conditional protocol declaration only.
# Ordinary Orchestrator completion receives JoinGuard exactly when a join obligation
# still has outstanding managed background. Long Stroke does not force that state;
# if it occurs physically, strict mock still recognizes the canonical continuation.
[[turn]]
id = "orch-join-guard"
internal = true
user = "# Delegated work you sent out has not come back yet. Continue the work."
tools = ["commission", "horizon", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "text", text = "Arrived consequences received; continue the orchestration." }

# AgentOwnerRoot Manager (opening is "#" + orch fork prompt). Fork + join; join
# stays blocked while holdChild keeps engineer incomplete for user_message wake.
# The real Manager provider surface includes native todowrite and independent assume.
[[turn]]
id = "manager-t1-commitment"
internal = true
user = "# The account is not yet ready to entrust."

  [[turn.step]]
  respond = { type = "tool-call", tool = "assume", args = { assumption = "Continue the long stroke until publish_proof.txt is verified." } }

  [[turn.step]]
  respond = { type = "text", text = "T1 commitment recorded." }

# The initial authority prompt drives iteration #1. Later incarnations use the
# owner-controlled manager-assess resource below; both carry the same Manager tools.
# After the join harvests the owned work the same turn closes its iteration: the
# two-stage deliver of work-006 needs the confirmation call (step 3) and the
# closing call with a different toolCallId (step 4) before the retirement exists.
[[turn]]
# ── the candidate/rebase ownership seam (measured 2026-10-18, release tier) ─────────────
# Road surfaces root at the PROJECT workspace, the candidate comes from the Change job's
# worktree: every `publish_proof.txt` in a run (root workspace and the job worktree
# `tmp/wanxiangshu-*`) carries the target-side content, the child's write lands in the root
# workspace, and the Change job's branch is created at the pre-conflict commit and then
# fast-forwards over the target — so the rebase is clean and no conflict can be detected
# until the two roots agree. The Manager cannot produce the deliverable itself: its own
# assess resource declares `todowrite-for-manager` a review-only READ tool, "disabled and
# rejected once accepted". A write rung on the manager ladder was tried and reverted.
# Acceptance evidence for whichever side fixes the seam is unchanged: the job worktree's
# branch must carry a real diff against the target (base != target head, candidate commit
# exists) before ConflictDetected can be recorded.
id = "manager-loop"
lane = "manager"
user = "# Run the long stroke: ship publish_proof.txt — join-wake, provider fallback, accept the assessment obligation then retire so publish can proceed."
tools = ["fork", "resume", "join", "horizon", "review", "deliver"]

  [[turn.step]]
  runtimeStep = 0
  respond = { type = "tool-call", tool = "review", prefixText = "The workspace needs implementation work before it can publish: completeness is not yet full because publish_proof.txt has not been established in the current delivery.", args = { findings = [{ acceptance_criteria = "the target state is not yet reached", work_plan = "close the remaining gap" }] } }

  [[turn.step]]
  runtimeStep = 1
  respond = { type = "tool-call", tool = "fork", args = { calling = "engineer", name = "Proof Writer", charge = "Write publish_proof.txt." } }

  [[turn.step]]
  runtimeStep = 2
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  runtimeStep = 3
  optional = true
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 4
  optional = true
  respond = { type = "tool-call", tool = "deliver", args = {} }

# A successor incarnation whose last provider-visible user message is the
# owner-controlled manager-assess resource. The ladder mirrors manager-loop —
# audit, work fork, join — because the successor retains its predecessor's
# history and then walks the same iteration shape; the binder varies the audit
# outcome by delivered attempt.
[[turn]]
id = "manager-reopened-loop"
internal = true
# The ordinal sentence is the leader; the declared fragment stays the stable
# tail so the successor number never has to be re-pinned per iteration.
user = ["# You are the ", "entrust read-only work to Engineer to establish facts about the predecessor's work"]
tools = ["fork", "resume", "join", "horizon", "review", "deliver"]

  [[turn.step]]
  runtimeStep = 0
  optional = true
  respond = { type = "tool-call", tool = "review", prefixText = "Independent audit of this tenure snapshot finds every required quality dimension complete and supported by the current workspace evidence.", args = { findings = [] } }

  [[turn.step]]
  runtimeStep = 1
  optional = true
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 2
  optional = true
  respond = { type = "tool-call", tool = "join", args = {} }

  # After the join harvests the repaired work the successor closes its own iteration:
  # the same turn keeps growing because the last user message is still this assess
  # resource (a mid-turn continuation never injects another user message).
  [[turn.step]]
  runtimeStep = 3
  optional = true
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 4
  optional = true
  respond = { type = "tool-call", tool = "deliver", args = {} }

# A fresh Manager terminal can race with the externally injected interruption
# while its child is still outstanding. INTERACTION-AUTHORITY-014 then requires
# this exact JoinGuard on the same Manager session. It is separate
# from manager-loop.2, which remains the sole provider-fault owner above.
[[turn]]
id = "manager-join-guard"
internal = true
optional = true
user = "# Delegated work you sent out has not come back yet. Continue the work."
tools = ["fork", "resume", "join", "horizon", "assume", "deliver"]
forbiddenTools = ["commission"]

  [[turn.step]]
  runtimeStep = 1
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 2
  respond = { type = "tool-call", tool = "assume", args = { assumption = "The active Manager life should continue the verified long-stroke route." } }

  [[turn.step]]
  runtimeStep = 3
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 4
  respond = { type = "tool-call", tool = "fork", args = { calling = "engineer", name = "Proof Finisher", charge = "Ensure publish_proof.txt contains exactly: Published by long-stroke canary" } }

  [[turn.step]]
  runtimeStep = 5
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  runtimeStep = 6
  respond = { type = "tool-call", tool = "fork", args = { name = "Proof Finisher", charge = "Verify the reused subagent received this second charge and publish_proof.txt is exact." } }

  [[turn.step]]
  runtimeStep = 7
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  runtimeStep = 8
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 9
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 10
  respond = { type = "text", text = "Manager rest in peace." }

[[turn]]
id = "continue"
internal = true
user = "# A network failure just interrupted you. Continue the work."

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "text", text = "The active join yielded to the newer user message." }

[[turn]]
id = "manager-interrupt"
lane = "manager"
user = "Interrupt the active join."

  [[turn.step]]
  respond = { type = "text", text = "The active join was interrupted and the child result was harvested." }

[[turn]]
id = "manager-current-action"
internal = true
# The Manager idle nudge is the `work/manager-continue` document followed by the
# resource of the session's current action (202926d72). The trailing resource varies
# with the work state; this declaration pins the nudge preamble plus the default
# `runtime/manager-work` face that a session with no lifecycle work receives.
user = [
  "# The current user task has not been completed or durably handed over. A natural end of your reply does not end that obligation, even when the reply contains a progress report. Continue the pending task: inspect the remaining goals, review findings and owned resources, then take the next action. Use `deliver` for a proved handoff or completion. For a temporary wait on background work, use `join`. Do not silently stop or claim that work will continue in the background after this conversation ends.",
  "# The gaps confirmed by review are now entrusted to you. Review-only read tools are now disabled; do not inspect, search, or process repository code yourself anymore. Arrange source changes and test writing through Engineer (note that Engineer has no bash access; git, compile, and test operations cannot be performed). Real command execution, git operations, compilation, and test verification can only be performed by resuming the fixed DevOps (name = `devops`) for authorized execution, direct ordinary repair, and checks against the final changed state.",
]
# The re-anchored current-action resource carries the review-only read tools DISABLED (its
# own text says so), so this ladder cannot host a close arc: production refuses every
# `deliver` it answers with "Cannot finish without a review". The road it keeps the Manager
# awake for has to be retired on the owner's own lane instead.
tools = ["join", "assume", "deliver"]

  # Delivery 1 is the nudge itself; later deliveries re-anchor the same resource after
  # the Manager answers, so any bounded runtime cursor may land here. The binder maps
  # the first observed cursor to the assumption, one cursor per work episode to join,
  # and every later cursor to deliver.
  [[turn.step]]
  runtimeStep = 0
  optional = true
  respond = { type = "tool-call", tool = "assume", args = { assumption = "The reviewed defects remain the current action until the owned work is joined." } }

  [[turn.step]]
  runtimeStep = 1
  optional = true
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
  runtimeStep = 2
  optional = true
  respond = { type = "tool-call", tool = "deliver", args = {} }

  [[turn.step]]
