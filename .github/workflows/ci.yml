name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Reject tracked tarballs and verify source dependency
        run: node scripts/wanxiangli-source.mjs check
      - run: npm ci
      - run: dotnet tool restore
      - name: Install ripgrep for real search checks
        run: |
          # rg backs the programming search capability, so verification needs it.
          # Runner images usually ship it; when they do not, apt is the only system
          # network dependency here and a DNS blip on the Ubuntu mirror kills the
          # whole job before verification starts. Fall back to the npm binary, which
          # resolves through the registry npm ci already uses.
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present"
          elif sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep; then
            echo "ripgrep installed from apt"
          else
            echo "apt unavailable, installing ripgrep from npm"
            npm install --no-save --no-audit --no-fund @vscode/ripgrep
            rg_bin="$(node -p "require('@vscode/ripgrep').rgPath")"
            sudo ln -sf "$rg_bin" /usr/local/bin/rg
          fi
          rg --version
      - name: Run verification
        id: verify
        env:
          NODE_TEST_CONCURRENCY: 2
          UNIT_VERDICT_SILENCE_MS: 30000
          SUITE_BACKSTOP_MS: 900000
          WXS_VERIFICATION_WORKER_DIAGNOSTICS: 0
          WXS_ACCEPT_TODO: 1
        run: |
          set -x
          if npm run verify:release; then
            exit 0
          else
            CODE=$?
            echo "::error::verify:release exited with $CODE"
            find .fable-build/verify-logs/ -type f -name "*.log" | sort | while read -r file; do
              echo "::error file=$file::$(head -n 1 "$file") | $(tail -n 1 "$file")"
            done
            exit $CODE
          fi
      - name: Upload verify logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .fable-build/verify-logs/
