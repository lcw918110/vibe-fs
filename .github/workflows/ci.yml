name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - run: dotnet tool restore
      - name: Run verification
        id: verify
        env:
          NODE_TEST_CONCURRENCY: 2
          UNIT_VERDICT_SILENCE_MS: 30000
          WXS_ACCEPT_TODO: "1"
        run: |
          set -x
          if node scripts/verify.mjs --release; then
            exit 0
          else
            CODE=$?
            echo "::error::verify:release exited with $CODE"
            find .fable-build/verify-logs/ -type f -name "*.log" | sort | while read -r file; do
              echo "::error file=$file::$(head -n 1 "$file") | $(tail -n 1 "$file")"
            done
            exit $CODE
          fi
      - name: Upload verify logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .fable-build/verify-logs/
